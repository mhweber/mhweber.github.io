<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PNW Atmospheric River Hex Surge — 30DayMapChallenge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- Data is loaded with a script tag (not fetch) so the page also works from file:// -->
  <script src="pnw_hex_data.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #0b0f19; font-family: system-ui, sans-serif; color: #f8fafc; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .hud {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px);
      padding: 14px 22px; border-radius: 12px; border: 1px solid rgba(148, 163, 184, 0.2);
      display: flex; align-items: center; gap: 16px; z-index: 10; min-width: 420px;
    }
    button {
      background: #0ea5e9; color: #0f172a; border: none; border-radius: 6px;
      padding: 6px 14px; font-weight: 700; cursor: pointer;
    }
    input[type="range"] { flex: 1; accent-color: #38bdf8; cursor: pointer; }
    #timestamp { font-variant-numeric: tabular-nums; font-size: 0.9rem; color: #cbd5e1; min-width: 155px; }
    .title-card {
      position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.85);
      padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .title-card h1 { margin: 0 0 4px 0; font-size: 1rem; letter-spacing: 0.02em; }
    .title-card p { margin: 0; font-size: 0.8rem; color: #94a3b8; }
    .title-card { max-width: min(340px, calc(100% - 40px)); }

    /* Narrow embeds (e.g. a small iframe or phone) */
    @media (max-width: 560px) {
      .hud {
        left: 10px; right: 10px; bottom: 10px; transform: none;
        min-width: 0; padding: 8px 10px; gap: 8px; border-radius: 10px;
      }
      button { padding: 5px 10px; }
      input[type="range"] { min-width: 0; width: 0; }
      #timestamp { min-width: 0; flex: none; font-size: 0.68rem; white-space: nowrap; }
      .title-card {
        top: 10px; left: 10px; padding: 8px 10px; border-radius: 8px;
        max-width: calc(100% - 20px);
      }
      .title-card h1 { font-size: 0.85rem; }
      .title-card p { font-size: 0.68rem; line-height: 1.3; }
      .title-card .detail { display: none; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="title-card">
    <h1>Pacific Northwest Streamflow Surge</h1>
    <p class="detail">NOAA National Water Model • H3 Hexagons</p>
    <p class="detail" style="margin-top:6px">Height and color = flow multiplier: flow in each hexagon's largest river divided by its flow at Nov 9 00:00 UTC (1x = unchanged, 5x = five times higher)</p>
    <div style="margin-top:8px;height:10px;border-radius:5px;background:linear-gradient(90deg,#1e293b,#0284c7 15%,#06b6d4 40%,#facc15 65%,#f43f5e)"></div>
    <div style="display:flex;justify-content:space-between;font-size:0.7rem;color:#94a3b8"><span>&lt;1x</span><span>1x</span><span>2.5x</span><span>5x</span><span>10x+</span></div>
  </div>
  <div class="hud">
    <button id="playBtn">Pause</button>
    <input id="slider" type="range" min="0" max="20" value="0" />
    <span id="timestamp">Loading...</span>
  </div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [-121.8, 45.8], // Centered over Cascades / Columbia / Puget Sound
      zoom: 6.2,
      pitch: 50,
      bearing: -15
    });

    let timestamps = [];
    let frame = 0;
    let playing = true;
    let timer = null;

    function getPaintExpressions(idx) {
      // Extract surge multiplier at current frame index
      const surgeAtIdx = ['get', 's' + idx];

      return {
        color: [
          'interpolate', ['linear'], surgeAtIdx,
          0.8, '#1e293b',   // Receding / low flow (Slate)
          1.0, '#0284c7',   // Baseline flow (Deep Blue)
          2.5, '#06b6d4',   // Rising river (Cyan)
          5.0, '#facc15',   // Major surge (Amber/Gold)
          10.0, '#f43f5e'   // Extreme flood wave (Neon Coral)
        ],
        height: [
          '*',
          ['max', 0, ['-', surgeAtIdx, 0.8]],
          6500 // Exaggeration factor in meters for 3D extrusion
        ]
      };
    }

    function setFrame(idx) {
      frame = idx;
      document.getElementById('slider').value = idx;
      document.getElementById('timestamp').textContent = timestamps[idx] || '';

      const expr = getPaintExpressions(idx);
      map.setPaintProperty('hex-surge', 'fill-extrusion-color', expr.color);
      map.setPaintProperty('hex-surge', 'fill-extrusion-height', expr.height);
    }

    map.on('load', async () => {
      const data = window.HEX_DATA;
      if (!data) {
        document.getElementById('timestamp').textContent = 'Data file pnw_hex_data.js not found';
        return;
      }
      timestamps = data.timestamps;

      // MapLibre stringifies array properties, so flatten to s0, s1, ... per frame
      data.features.forEach((f) => {
        f.properties.surge.forEach((v, i) => { f.properties['s' + i] = v; });
      });

      const slider = document.getElementById('slider');
      slider.max = timestamps.length - 1;

      map.addSource('pnw-hex', { type: 'geojson', data });

      const initialExpr = getPaintExpressions(0);
      map.addLayer({
        id: 'hex-surge',
        type: 'fill-extrusion',
        source: 'pnw-hex',
        paint: {
          'fill-extrusion-color': initialExpr.color,
          'fill-extrusion-height': initialExpr.height,
          'fill-extrusion-opacity': 0.88,
          'fill-extrusion-height-transition': { duration: 250, delay: 0 },
          'fill-extrusion-color-transition': { duration: 250, delay: 0 }
        }
      });

      setFrame(0);

      timer = setInterval(() => {
        if (playing) setFrame((frame + 1) % timestamps.length);
      }, 350);

      slider.addEventListener('input', (e) => {
        playing = false;
        document.getElementById('playBtn').textContent = 'Play';
        setFrame(Number(e.target.value));
      });

      document.getElementById('playBtn').addEventListener('click', () => {
        playing = !playing;
        document.getElementById('playBtn').textContent = playing ? 'Pause' : 'Play';
      });
    });
  </script>
</body>
</html>
